<!-- Layout: one phone-width column. Server address, verse card, then results. -->
<title>ReciteRight Quran Reader</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  @import url("https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Nunito:wght@400;600;800&display=swap");

  :root {
    --bg: #f5f3ee;
    --surface: #ffffff;
    --ink: #1c2633;
    --muted: #6b7682;
    --accent: #2f7a6b;
    --ok: #2f8f5b;
    --bad: #c8553d;
    --vowel: #b7791f;
    --gold: #e0a33a;
    --line: #e4e0d6;
    --font-arabic: "Amiri", "Traditional Arabic", serif;
    --font-ui: "Nunito", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1a22;
      --surface: #172631;
      --ink: #eef3f6;
      --muted: #9aa8b4;
      --accent: #6fcab5;
      --ok: #5fd39a;
      --bad: #ff8a72;
      --vowel: #f2bd5a;
      --gold: #f2bd5a;
      --line: #263a48;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1a22;
    --surface: #172631;
    --ink: #eef3f6;
    --muted: #9aa8b4;
    --accent: #6fcab5;
    --ok: #5fd39a;
    --bad: #ff8a72;
    --vowel: #f2bd5a;
    --gold: #f2bd5a;
    --line: #263a48;
    color-scheme: dark;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    padding-block: 16px 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    max-width: 520px;
    margin-inline: auto;
  }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 18px; margin: 0; font-weight: 800; }
  .pill { font-size: 13px; color: var(--muted); }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px;
    margin-top: 14px;
  }

  .server label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .server input {
    font: inherit;
    font-size: 14px;
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
  }
  .server .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .ayah-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .ayah-label { font-size: 14px; font-weight: 600; color: var(--muted); }
  button {
    font: inherit;
    font-weight: 700;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    padding: 10px 16px;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  button:disabled { opacity: 0.45; cursor: default; }

  .verse {
    font-family: var(--font-arabic);
    font-size: 30px;
    line-height: 2.3;
    text-align: right;
    direction: rtl;
    margin: 14px 0 6px;
    min-height: 120px;
  }
  .word { padding: 2px 4px; border-radius: 8px; transition: background 0.2s, color 0.2s; }
  .word.ok { color: var(--ok); }
  .word.bad { color: var(--bad); text-decoration: underline wavy var(--bad); }
  .word.vowel { color: var(--vowel); text-decoration: underline dotted var(--vowel); }
  .word.skip { color: var(--muted); text-decoration: line-through; opacity: 0.7; }
  .word.current { background: color-mix(in srgb, var(--gold) 28%, transparent); }

  .status { font-size: 14px; color: var(--muted); min-height: 20px; }
  .controls { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }

  .score { display: flex; align-items: baseline; gap: 10px; margin-top: 14px; }
  .score strong { font-size: 40px; font-variant-numeric: tabular-nums; }

  .mistake { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
  .mistake-head { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 700; }
  .tag { font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; color: var(--muted); }
  .pair { display: grid; grid-template-columns: 70px 1fr; gap: 6px 12px; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .pair .word-cell { font-family: var(--font-arabic); font-size: 22px; direction: rtl; text-align: right; color: var(--ink); min-width: 0; }
  .pair .expected { color: var(--ok); }
  .pair .recited { color: var(--bad); }
  .mistake.vowel-mistake .recited { color: var(--vowel); }

  .empty { color: var(--muted); font-size: 14px; }
</style>

<header>
  <h1>Read from Quran</h1>
  <span class="pill" id="surahLabel">Al-Fatiha</span>
</header>

<section class="card server" aria-label="Server">
  <label for="serverUrl">Model server address</label>
  <input id="serverUrl" type="url" placeholder="https://....trycloudflare.com" autocomplete="off">
  <p class="hint">Paste the address the Colab notebook prints. It changes each time the notebook restarts.</p>
</section>

<section class="card" aria-label="Verse">
  <div class="ayah-nav">
    <button id="prevBtn">Previous</button>
    <span class="ayah-label" id="ayahLabel">Ayah 1 of 7</span>
    <button id="nextBtn">Next</button>
  </div>

  <div class="verse" id="verse" lang="ar" dir="rtl"></div>

  <div class="status" id="status">Paste the server address, then tap "Start reciting".</div>

  <div class="controls">
    <button class="primary" id="recBtn">Start reciting</button>
    <button id="resetBtn">Reset</button>
  </div>
</section>

<section class="card" aria-label="Results">
  <div class="score">
    <strong id="percent">0%</strong>
    <span class="pill" id="countLabel">0 of 0 words correct</span>
  </div>
  <div id="mistakes">
    <p class="empty">Mistakes will appear here.</p>
  </div>
</section>

<script>
  const SURAH = "Al-Fatiha";
  const AYAHS = [
    "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ",
    "ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَٰلَمِينَ",
    "ٱلرَّحْمَٰنِ ٱلرَّحِيمِ",
    "مَٰلِكِ يَوْمِ ٱلدِّينِ",
    "إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ",
    "ٱهْدِنَا ٱلصِّرَٰطَ ٱلْمُسْتَقِيمَ",
    "صِرَٰطَ ٱلَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ ٱلْمَغْضُوبِ عَلَيْهِمْ وَلَا ٱلضَّآلِّينَ"
  ];

  const CLIP_MS = 2500;          // length of each recording sent to the server
  const MARKS = /[ً-ٰٟۖ-ۭ]/;

  let ayahIndex = 0;
  let words = [];       // reference words for the current ayah
  let state = [];       // per word: "pending" | "ok" | "bad" | "skip" | "vowel"
  let recited = [];     // what the child said for a wrong or wrong-vowel word
  let pointer = 0;      // index of the word the child should say next
  let session = 0;      // bumps on every ayah change, so old clips are ignored
  let cycling = false;
  let stream = null;
  let recorder = null;
  let queue = Promise.resolve();

  const verseEl = document.getElementById("verse");
  const statusEl = document.getElementById("status");
  const recBtn = document.getElementById("recBtn");
  const mistakesEl = document.getElementById("mistakes");
  const percentEl = document.getElementById("percent");
  const countEl = document.getElementById("countLabel");
  const ayahLabel = document.getElementById("ayahLabel");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const serverInput = document.getElementById("serverUrl");

  // Remember the server address for this viewer (optional, so wrapped in try/catch)
  try {
    serverInput.value = localStorage.getItem("reciteServer") || "";
  } catch (e) { /* storage unavailable: the box just starts empty */ }
  serverInput.addEventListener("change", () => {
    try { localStorage.setItem("reciteServer", serverInput.value.trim()); } catch (e) {}
  });

  // Letters only: strip vowel marks and normalise letter forms
  function normalise(text) {
    return text
      .replace(/[ً-ٰٟۖ-ۭ]/g, "")
      .replace(/[ٱأإآ]/g, "ا")
      .replace(/ى/g, "ي")
      .replace(/ة/g, "ه")
      .trim();
  }

  // The vowel marks of a word, in order, so two words can be compared on their vowels
  function vowelSig(text) {
    return Array.from(text).filter(ch => MARKS.test(ch)).join("");
  }

  function loadAyah() {
    session++;
    words = AYAHS[ayahIndex].split(/\s+/);
    state = words.map(() => "pending");
    recited = words.map(() => "");
    pointer = 0;
    verseEl.innerHTML = "";
    words.forEach((w, i) => {
      const span = document.createElement("span");
      span.className = "word";
      span.textContent = w + " ";
      verseEl.appendChild(span);
    });
    ayahLabel.textContent = `Ayah ${ayahIndex + 1} of ${AYAHS.length}`;
    prevBtn.disabled = ayahIndex === 0;
    nextBtn.disabled = ayahIndex === AYAHS.length - 1;
    renderVerse();
    renderMistakes();
  }

  function renderVerse() {
    verseEl.querySelectorAll(".word").forEach((span, i) => {
      span.classList.remove("ok", "bad", "vowel", "skip", "current");
      if (state[i] !== "pending") span.classList.add(state[i]);
      if (i === pointer && pointer < words.length) span.classList.add("current");
    });
  }

  // Judge one spoken word against the words the child should say next.
  // Letters must match. If they do, the vowel marks are compared too.
  // A match one or two words ahead means the words in between were skipped.
  function judge(spoken) {
    if (pointer >= words.length) return;
    const heardLetters = normalise(spoken);

    for (let ahead = 0; ahead <= 2 && pointer + ahead < words.length; ahead++) {
      const target = words[pointer + ahead];
      if (normalise(target) === heardLetters) {
        for (let k = 0; k < ahead; k++) state[pointer + k] = "skip";
        const idx = pointer + ahead;
        // Only check vowels if the server actually returned vowel marks
        const hasMarks = MARKS.test(spoken);
        const vowelsOk = !hasMarks || vowelSig(target) === vowelSig(spoken);
        state[idx] = vowelsOk ? "ok" : "vowel";
        recited[idx] = spoken;
        pointer = idx + 1;
        return afterJudge();
      }
    }

    state[pointer] = "bad";
    recited[pointer] = spoken;
    pointer++;
    afterJudge();
  }

  function afterJudge() {
    renderVerse();
    renderMistakes();
    if (pointer >= words.length) {
      statusEl.textContent = ayahIndex < AYAHS.length - 1
        ? "Ayah finished. Tap Next to continue."
        : "Surah finished. Well done.";
      stopListening();
    }
  }

  function renderMistakes() {
    const ok = state.filter(s => s === "ok").length;
    const total = words.length;
    const pct = total ? Math.round((ok / total) * 100) : 0;
    percentEl.textContent = pct + "%";
    countEl.textContent = `${ok} of ${total} words correct`;

    mistakesEl.innerHTML = "";
    const flagged = state
      .map((s, i) => (s === "bad" || s === "skip" || s === "vowel" ? i : -1))
      .filter(i => i >= 0);

    if (flagged.length === 0) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "Mistakes will appear here.";
      mistakesEl.appendChild(p);
      return;
    }

    flagged.forEach(i => {
      const kind = state[i];
      const label = kind === "skip" ? "Skipped word"
        : kind === "vowel" ? "Wrong vowel"
        : "Incorrect word";
      const wrap = document.createElement("div");
      wrap.className = "mistake" + (kind === "vowel" ? " vowel-mistake" : "");
      wrap.innerHTML = `
        <div class="mistake-head">
          <span>${label}</span>
          <span class="tag">${ayahIndex + 1}:${i + 1}</span>
        </div>
        <div class="pair">
          <span>Expected</span><span class="word-cell expected"></span>
          <span>Recited</span><span class="word-cell recited"></span>
        </div>`;
      wrap.querySelector(".expected").textContent = words[i];
      wrap.querySelector(".recited").textContent = kind === "skip" ? "not said" : recited[i];
      mistakesEl.appendChild(wrap);
    });
  }

  // Clips are sent one at a time, in the order they were recorded
  function enqueue(task) {
    queue = queue.then(task).catch(() => {
      statusEl.textContent = "Couldn't reach the server. Check the address and that the Colab notebook is running.";
    });
  }

  async function sendClip(url, blob, sess) {
    if (sess !== session) return;          // the ayah changed while this clip was recording
    const form = new FormData();
    form.append("audio", blob, "clip.webm");
    const res = await fetch(url + "/transcribe", { method: "POST", body: form });
    if (!res.ok) throw new Error("server " + res.status);
    const data = await res.json();
    if (sess !== session) return;
    (data.text || "").trim().split(/\s+/).filter(Boolean).forEach(judge);
  }

  // Record one short clip, then start the next straight away
  function recordCycle(url) {
    if (!cycling || !stream) return;
    const sess = session;
    const chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
      if (cycling) recordCycle(url);
      else releaseMicrophone();
      if (blob.size) enqueue(() => sendClip(url, blob, sess));
    };
    recorder.start();
    setTimeout(() => {
      if (recorder && recorder.state === "recording") recorder.stop();
    }, CLIP_MS);
  }

  async function startListening() {
    const url = serverInput.value.trim().replace(/\/+$/, "");
    if (!url) {
      statusEl.textContent = "Paste the server address from the Colab notebook first.";
      return;
    }
    try { localStorage.setItem("reciteServer", url); } catch (e) {}

    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      statusEl.textContent = "Microphone access was blocked. Allow it and try again.";
      return;
    }
    cycling = true;
    recBtn.textContent = "Stop";
    statusEl.textContent = "Listening. Read the verse aloud.";
    recordCycle(url);
  }

  function releaseMicrophone() {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
  }

  function stopListening() {
    cycling = false;
    recBtn.textContent = "Start reciting";
    if (recorder && recorder.state === "recording") {
      recorder.stop();               // its onstop sends the last clip and releases the microphone
    } else {
      releaseMicrophone();
    }
  }

  recBtn.addEventListener("click", () => {
    if (cycling) stopListening();
    else if (pointer >= words.length) statusEl.textContent = "Tap Reset to read this ayah again.";
    else startListening();
  });

  document.getElementById("resetBtn").addEventListener("click", () => {
    stopListening();
    loadAyah();
    statusEl.textContent = "Paste the server address, then tap \"Start reciting\".";
  });

  prevBtn.addEventListener("click", () => { stopListening(); ayahIndex--; loadAyah(); });
  nextBtn.addEventListener("click", () => { stopListening(); ayahIndex++; loadAyah(); });

  document.getElementById("surahLabel").textContent = SURAH;
  loadAyah();
</script>
